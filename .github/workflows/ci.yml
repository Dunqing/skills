name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        python: ['3.9', '3.14']
        include:
          - os: macos-latest
            python: '3.14'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Check skill layout
        shell: bash
        run: |
          set -euo pipefail
          for skill in skills/*; do
            test -d "$skill"
            test -s "$skill/SKILL.md"
            test -s "$skill/README.md"
            test -s "$skill/LICENSE"
          done
      - name: Compile Python helpers and tests
        run: python -I -m compileall -q skills
      - name: Check Codespaces CLI entry point
        run: python -I skills/codespaces-run/scripts/sandbox.py --help
      - name: Run skill tests
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          for skill in skills/*; do
            if [ -d "$skill/tests" ]; then
              python -I -m unittest discover -s "$skill/tests" -v
            fi
          done
